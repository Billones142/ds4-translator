name: Release

# Builds ds4-translator/ds4-ctl and publishes a downloadable tarball whenever
# a version tag (v*) is pushed to main, so users can install without needing
# a compiler (see README's "Download a release" instructions).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: `git describe --tags` (used as a sanity
          # check below, and by anyone rebuilding from this same checkout)
          # needs more than the tagged commit alone to resolve reliably.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # gcc/g++-multilib provide -m32 support, needed to build the
          # 32-bit libudev-sony-spoof32.so target alongside the 64-bit one.
          # libusb-1.0-0-dev is required unconditionally by the Makefile
          # now (the default hide method's USB transport, src/usb-hid-transport.cpp).
          # libbpf-dev/clang are required unconditionally too (hard
          # $(error ...) gates in the Makefile) -- see lint.yml's identical
          # step for the full rationale (HID-BPF Bluetooth transport).
          sudo apt-get install -y build-essential gcc-multilib g++-multilib libusb-1.0-0-dev libbpf-dev clang pkg-config

      - name: Install bpftool
        run: |
          # See lint.yml's identical step: apt's bpftool (via
          # linux-tools-generic) is version-locked to `uname -r` and
          # mismatches GH's runner kernel; a static release binary avoids
          # that entirely.
          set -e
          curl -sL -o /tmp/bpftool.tar.gz \
            https://github.com/libbpf/bpftool/releases/download/v7.7.0/bpftool-v7.7.0-amd64.tar.gz
          tar -xzf /tmp/bpftool.tar.gz -C /tmp bpftool
          sudo install -m 755 /tmp/bpftool /usr/local/bin/bpftool
          bpftool version

      - name: Build
        run: make all VERSION="${GITHUB_REF_NAME}"

      - name: Package release archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIST_NAME="ds4-translator-${VERSION}"
          mkdir -p "dist/${DIST_NAME}"
          # Clean, tracked-files-only source tree (no .git, no build output,
          # no local dev artifacts) plus the binaries just built above, so
          # extracting the tarball and running `sudo make install` works
          # immediately without needing a compiler.
          git archive HEAD | tar -x -C "dist/${DIST_NAME}"
          # Copy the whole build/ dir, .o files included — not just the
          # final binaries — so every target in the Makefile's dependency
          # graph is already satisfied and `make install` on the extracted
          # tarball does zero compiling (the point of shipping a release:
          # no compiler required).
          mkdir -p "dist/${DIST_NAME}/build"
          cp -r build/. "dist/${DIST_NAME}/build/"
          # Fallback for `make` inside the extracted tarball, which has no
          # .git for `git describe` to read from.
          echo "${VERSION}" > "dist/${DIST_NAME}/VERSION"
          tar -czf "${DIST_NAME}.tar.gz" -C dist "${DIST_NAME}"
          echo "ASSET_PATH=${DIST_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
